<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cadastre-se como colaborador da ONG União.">
<title>União | Cadastro</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/script.js" defer></script>
</head>
<body>
<header class="topo"><div class="container barra"><a class="logo" href="../index.html">União</a><nav aria-label="Menu principal"><ul><li><a href="../index.html">Início</a></li><li><a href="projetos.html">Projetos</a></li><li><a href="cadastro.html" aria-current="page">Cadastro</a></li></ul></nav></div></header>
<main>
<section class="titulo">
<div class="container">
<h1>Cadastro de colaborador</h1>
<p>Preencha os campos para participar. Campos com * são obrigatórios.</p>
</div>
</section>

<section class="container secao" aria-labelledby="titulo-form">
<h2 id="titulo-form" class="visualmente-oculto">Formulário de cadastro</h2>
<form id="formCadastro" action="#" method="post">

<fieldset>
<legend>Dados pessoais</legend>
<div class="campo"><label for="nome">Nome completo *</label>
<input id="nome" name="nome" type="text" minlength="3" maxlength="100" autocomplete="name" pattern="[A-Za-zÀ-ÿ' ]{3,100}" title="Use apenas letras e espaços (mínimo 3 caracteres)." required></div>
<div class="campo"><label for="cpf">CPF *</label>
<input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required></div>
<div class="campo"><label for="nascimento">Data de nascimento *</label>
<input id="nascimento" name="nascimento" type="date" min="1900-01-01" autocomplete="bday" required></div>
<div class="campo"><label for="email">E-mail *</label>
<input id="email" name="email" type="email" maxlength="120" autocomplete="email" placeholder="nome@exemplo.com" required></div>
<div class="campo"><label for="telefone">Telefone *</label>
<input id="telefone" name="telefone" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" maxlength="15" pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Formato: (00) 00000-0000 ou (00) 0000-0000" autocomplete="tel" required></div>
</fieldset>

<fieldset>
<legend>Endereço</legend>
<div class="campo"><label for="cep">CEP *</label>
<input id="cep" name="cep" type="text" inputmode="numeric" placeholder="00000-000" maxlength="9" pattern="\d{5}-\d{3}" title="Formato: 00000-000" autocomplete="postal-code" required></div>
<div class="campo"><label for="endereco">Endereço *</label>
<input id="endereco" name="endereco" type="text" maxlength="120" autocomplete="address-line1" required></div>
<div class="campo"><label for="cidade">Cidade *</label>
<input id="cidade" name="cidade" type="text" maxlength="80" autocomplete="address-level2" required></div>
<div class="campo"><label for="estado">Estado *</label>
<select id="estado" name="estado" autocomplete="address-level1" required><option value="">Selecione</option><option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option></select></div>
</fieldset>

<fieldset>
<legend>Participação</legend>
<div class="campo"><label for="projeto">Projeto de interesse *</label>
<select id="projeto" name="projeto" required><option value="">Selecione</option><option>Educação para Todos</option><option>Alimento Solidário</option><option>Inclusão Digital</option></select></div>
<div class="campo"><label for="mensagem">Como deseja ajudar?</label>
<textarea id="mensagem" name="mensagem" rows="5" maxlength="500"></textarea></div>
<div class="check"><input id="confirmo" name="confirmo" type="checkbox" required><label for="confirmo">Confirmo que os dados informados são verdadeiros. *</label></div>
</fieldset>

<button class="btn" type="submit">Enviar cadastro</button>
<button class="btn btn-sec" type="reset">Limpar</button>
<p id="status" role="status"></p>
</form>
</section>
</main>
<footer class="rodape"><div class="container"><p>&copy; 2026 ONG União &mdash; Projeto acadêmico.</p></div></footer>
</body>
</html>
